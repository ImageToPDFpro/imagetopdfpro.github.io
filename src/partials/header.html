<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{base}}/">
      <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="8" fill="currentColor"/>
        <path d="M10 6.5h8.5L23 11v14.5a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1v-18a1 1 0 0 1 1-1z" fill="#fff"/>
        <path d="M18.5 6.5V10a1 1 0 0 0 1 1H23z" fill="#f2c4bf"/>
        <path d="M11.2 23.5l3.6-4.8 2.6 3.1 1.9-2.3 3 4z" fill="currentColor"/>
        <circle cx="19.2" cy="15.2" r="1.7" fill="currentColor"/>
      </svg>
      <span class="brand-name">{{siteName}}</span>
    </a>

    <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="visually-hidden">Menu</span>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul role="list">
        <li><a href="{{base}}/" data-nav="home">Image to PDF</a></li>
        <li><a href="{{base}}/guides/" data-nav="guides">Guides</a></li>
        <li><a href="{{base}}/about/" data-nav="about">About</a></li>
        <li><a href="{{base}}/contact/" data-nav="contact">Contact</a></li>
      </ul>
    </nav>

    <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>
